<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario</title>
</head>
<body>


<div class="login">
    <form class="form">
      <label for="nombre">Nombre</label>
      <input type="text" class="inputNombre" name="nombre" id="nombre">
      <label for="color">Equipo</label>
      <select name="color" id="color">
        <option value="" disabled selected>Select color</option>
        <option value="red">Rojo</option>
        <option value="green">Verde</option>
        <option value="orange">Naranja</option>
      </select>
      <fieldset>
        <legend>Equipo</legend>
        <input type="radio" value="gatos" name="equipo" class="input-radio" id="gatos">
        <label for="gatos">Gatos</label>
        <input type="radio" value="mapaches" name="equipo" class="input-radio" id="mapaches">
        <label for="mapaches">Mapaches</label>
        <input type="radio" name="equipo" value="perros" class="input-radio" id="perros">
        <label for="perros">Perros</label>
      </fieldset>
      <button type="submit">Enviar</button>



    </form>
  </div>
  
  <div class="userPage" style="display:none;">
    <img class="img-equipo" src="..." alt="equipo">
    <h1 class="text-saludo">Hola Usuario</h1>
    <p>Perteneces al equipo <span class="text-equipo"></span> </p>

    <button class="btn-regresar">Regresar</button>
  </div>


  <script src="./app.js"></script>
